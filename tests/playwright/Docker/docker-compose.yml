services:
    xdmod:
        image: ${XDMOD_IMAGE}
        container_name: xdmod
        hostname: xdmod
        shm_size: 2g
        ports:
            - 9006:443
            - 7000:7000
        environment:
            XDMOD_REALMS: ${XDMOD_REALMS}
        stdin_open: true
        tty: true
        command: sleep infinity
    playwright:
        image:  mcr.microsoft.com/playwright:v1.60.0-jammy
        hostname: playwright
        container_name: playwright
        stdin_open: true
        tty: true
        ipc: host
        links:
            - xdmod
        depends_on:
            - xdmod
        environment:
            BASE_URL: https://xdmod
            XDMOD_REALMS: ${XDMOD_REALMS}
        command: sleep infinity
